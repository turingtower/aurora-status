# Aurora platform status — Upptime configuration
# The monitored URL is a repository SECRET ($PROD_HEALTH_URL) so no hostname
# appears in this public repo. One monitor on purpose: a simple
# "Aurora is up / down" page — no per-environment or per-tenant detail.
owner: turingtower
repo: aurora-status

sites:
  - name: Aurora Platform
    url: $PROD_HEALTH_URL
    expectedStatusCodes:
      - 200

status-website:
  cname: status.aurora.turingtower.com
  name: Aurora Status
  logoUrl: https://raw.githubusercontent.com/turingtower/aurora-status/HEAD/assets/logo.svg
  faviconSvg: https://raw.githubusercontent.com/turingtower/aurora-status/HEAD/assets/logo.svg
  theme: dark
  introTitle: "**Aurora** by Turing Tower"
  introMessage: Live platform availability, checked every 5 minutes. Incident history is published below.
  navbar:
    - title: Status
      href: /
  customHeadHtml: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --aurora-bg: #0b1220;
        --aurora-panel: #101a2e;
        --aurora-border: #1e293b;
        --aurora-text: #e2e8f0;
        --aurora-muted: #8fa3bd;
        --aurora-cyan: #22d3ee;
      }
      html, body {
        background: var(--aurora-bg) !important;
        color: var(--aurora-text) !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background:
          radial-gradient(60rem 30rem at 80% -10%, rgba(34, 211, 238, 0.07), transparent 60%),
          radial-gradient(50rem 28rem at 10% 110%, rgba(56, 130, 246, 0.06), transparent 60%);
      }
      /* top nav */
      nav, header {
        background: rgba(11, 18, 32, 0.85) !important;
        border-bottom: 1px solid var(--aurora-border) !important;
        backdrop-filter: blur(8px);
        box-shadow: none !important;
      }
      nav img { border-radius: 8px; }
      nav a, header a { color: var(--aurora-text) !important; font-weight: 600; }
      /* headings + intro */
      h1, h2, h3, h4 { color: var(--aurora-text) !important; letter-spacing: -0.01em; }
      .lead, p { color: var(--aurora-muted) !important; }
      .lead strong, h1 strong, h2 strong { color: var(--aurora-cyan) !important; }
      /* centered column */
      main.container, nav > .container {
        max-width: 1040px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding-left: 24px !important;
        padding-right: 24px !important;
      }
      main.container { padding-top: 28px !important; padding-bottom: 48px !important; }
      nav img { width: 34px; height: 34px; }
      /* sections default to invisible wrappers (kills empty slivers)… */
      main > section {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        margin: 14px 0 !important;
      }
      /* the overall-status banner is article.up / article.down */
      main > article.up, main > article.down {
        border-radius: 14px !important;
        padding: 22px 24px !important;
        font-size: 17px; font-weight: 600;
        box-shadow: 0 8px 30px rgba(2, 8, 20, 0.45) !important;
      }
      main > article.up {
        background: linear-gradient(180deg, rgba(52, 211, 153, 0.08), rgba(16, 26, 46, 0.92)) !important;
        border: 1px solid rgba(52, 211, 153, 0.25) !important;
      }
      main > article.down {
        background: linear-gradient(180deg, rgba(244, 63, 94, 0.10), rgba(16, 26, 46, 0.92)) !important;
        border: 1px solid rgba(244, 63, 94, 0.35) !important;
      }
      /* the per-monitor live-status card + incident articles */
      .live-status, main section article {
        background: var(--aurora-panel) !important;
        border: 1px solid var(--aurora-border) !important;
        border-radius: 14px !important;
        padding: 20px 22px !important;
        color: var(--aurora-text) !important;
        box-shadow: 0 8px 30px rgba(2, 8, 20, 0.35) !important;
      }
      /* "Live Status" heading + range pills on one row */
      .f.changed {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        flex-wrap: wrap; gap: 12px;
        background: transparent !important; border: none !important; box-shadow: none !important;
        margin-top: 26px !important;
      }
      .f.changed h2 { margin: 0 !important; font-size: 20px; }
      /* the 24h/7d/30d/1y/all selector → inline pill group */
      form.f.r {
        display: inline-flex !important;
        flex-direction: row !important;
        gap: 6px;
        background: var(--aurora-panel) !important;
        border: 1px solid var(--aurora-border) !important;
        border-radius: 999px !important;
        padding: 4px !important;
        box-shadow: none !important;
      }
      form.f.r > div { display: inline-flex !important; }
      form.f.r input[type='radio'] { position: absolute; opacity: 0; pointer-events: none; }
      form.f.r label {
        display: inline-block; cursor: pointer;
        padding: 5px 14px; border-radius: 999px;
        font-size: 13px; font-weight: 600; color: var(--aurora-muted);
        transition: all .15s ease;
      }
      form.f.r label:hover { color: var(--aurora-text); }
      form.f.r input:checked + label {
        background: rgba(34, 211, 238, 0.14);
        color: var(--aurora-cyan);
      }
      a { color: var(--aurora-cyan) !important; text-decoration: none; }
      a:hover { color: #67e8f9 !important; }
      img[alt*='up'], img[alt*='down'] { filter: saturate(1.1); }
      img[src*='graphs'] { background: transparent !important; border-radius: 10px; }
      footer { display: none !important; }
      ::selection { background: rgba(34, 211, 238, 0.3); }
    </style>

# Probe cadence: every 5 minutes (Upptime default). Response-time graphs
# commit daily. Incidents auto-open GitHub issues — watch the repo for email.
