# Aurora platform status — Upptime configuration
# Monitored URLs are repository SECRETS ($PROD_HEALTH_URL etc.) so customer
# hostnames never appear in this public repo. Set them under
# Settings → Secrets and variables → Actions.
owner: turingtower
repo: status

sites:
  - name: Aurora Platform (Production)
    url: $PROD_HEALTH_URL
    expectedStatusCodes:
      - 200
  - name: Aurora Demo Environment
    url: $DEMO_HEALTH_URL
    expectedStatusCodes:
      - 200

status-website:
  cname: status.aurora.turingtower.com
  name: Aurora Status
  introTitle: "**Aurora by Turing Tower** — platform status"
  introMessage: Live availability of the Aurora platform, updated every 5 minutes. Incident history is published below.
  navbar:
    - title: Status
      href: /
  theme: dark

# Probe cadence: every 5 minutes (Upptime default for uptime checks).
# Response-time graphs commit daily. Incidents auto-open GitHub issues —
# subscribe to the repo to get notified.
